[package]
name = "bulbul"
version = "0.1.0"
description = "bulbul: a companion that evolves only from verified on-chain commitments"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "bulbul"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "1.2.0"
anchor-spl = "1.2.0"

[dev-dependencies]
litesvm = "0.17.0"
solana-message = "4.2.4"
solana-transaction = "4.1.5"
solana-signer = "3.0.1"
solana-keypair = "3.1.2"
solana-account = "4.3.0"
solana-clock = "3.2.1"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
